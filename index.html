<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weigh-in Log</title>
<meta name="theme-color" content="#127566">
<meta name="description" content="Offline daily weight log. Data stays on your device.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}body{margin:0}</style>
<style>
/* Layout: one narrow column like a phone app — scale readout + entry, then trend chart, then the log. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --ink: #17201f;
  --muted: #5d6b69;
  --line: #d5dedc;
  --accent: #127566;
  --accent-soft: #d7ece7;
  --lcd: #1b2624;
  --lcd-ink: #9ff0d8;
  --down: #127566;
  --up: #b4532a;
  --font-display: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101615; --surface: #18201f; --ink: #e5eeec; --muted: #93a3a0; --line: #2a3533;
    --accent: #4cc7ab; --accent-soft: #1c3631; --lcd: #0a0f0e; --lcd-ink: #9ff0d8;
    --down: #4cc7ab; --up: #e58a5f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101615; --surface: #18201f; --ink: #e5eeec; --muted: #93a3a0; --line: #2a3533;
  --accent: #4cc7ab; --accent-soft: #1c3631; --lcd: #0a0f0e; --lcd-ink: #9ff0d8;
  --down: #4cc7ab; --up: #e58a5f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
.status { font-size: 0.8rem; color: var(--muted); }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

/* Scale readout */
.scale { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.lcd { background: var(--lcd); border-radius: 12px; padding: 14px 18px; display: flex; align-items: baseline; justify-content: flex-end; gap: 8px; }
.lcd input {
  all: unset; width: 100%; min-width: 0; text-align: right; font-family: var(--font-display); font-weight: 300;
  font-size: clamp(2.6rem, 13vw, 3.6rem); color: var(--lcd-ink); font-variant-numeric: tabular-nums; caret-color: var(--lcd-ink);
}
.lcd input::placeholder { color: var(--lcd-ink); opacity: 0.25; }
.lcd .unit { font-family: var(--font-display); color: var(--lcd-ink); opacity: 0.7; font-size: 1rem; }
.lcd:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: stretch; }
.row input[type="date"] {
  flex: 1 1 150px; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px;
}
button { font: inherit; cursor: pointer; }
.btn-primary {
  flex: 1 1 120px; background: var(--accent); color: var(--surface); border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600;
}
.btn-primary:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.msg { font-size: 0.85rem; color: var(--muted); min-height: 1.2em; margin: 0; }
.msg.err { color: var(--up); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { display: flex; flex-direction: column; gap: 4px; padding: 0 2px; }
.stat .v { font-family: var(--font-display); font-weight: 500; font-size: 1.15rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v small { font-size: 0.7rem; color: var(--muted); font-weight: 300; }
.v.down { color: var(--down); } .v.up { color: var(--up); }

/* Chart */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); }
#chart { width: 100%; display: block; }
#chart text { font-family: var(--font-display); font-size: 10px; fill: var(--muted); }
.legend { display: flex; gap: 16px; font-size: 0.78rem; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; vertical-align: middle; margin-right: 6px; }
.legend .l-dot::before { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); opacity: 0.6; }
.legend .l-avg::before { width: 16px; height: 3px; border-radius: 2px; background: var(--accent); }
.example-tag { font-size: 0.75rem; color: var(--muted); font-style: italic; }

/* Log */
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.log li:first-child { border-top: 0; }
.log .d { color: var(--muted); font-size: 0.9rem; min-width: 0; }
.log .w { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-weight: 500; }
.log .delta { font-family: var(--font-display); font-size: 0.75rem; font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; color: var(--muted); }
.log .delta.down { color: var(--down); } .log .delta.up { color: var(--up); }
.del { border: 0; background: transparent; color: var(--muted); padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; }
.del.armed { background: var(--up); color: var(--surface); }
.empty { color: var(--muted); font-size: 0.9rem; margin: 4px 0; }
.btn-ghost { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 6px 12px; font-size: 0.8rem; font-weight: 600; }
#csvbox { width: 100%; min-height: 120px; font-family: var(--font-display); font-size: 0.75rem; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
@media (max-width: 380px) { .stats { gap: 6px; } .stat .v { font-size: 1rem; } }
@media (prefers-reduced-motion: no-preference) { .btn-primary { transition: opacity .15s; } }
</style>

</head><body>
<div class="wrap">
  <header>
    <h1>Weigh-in Log</h1>
    <span class="status" id="status">Loading…</span>
  </header>

  <form class="scale" id="form" autocomplete="off">
    <label class="lcd" for="kg">
      <input id="kg" name="kg" inputmode="decimal" placeholder="00.0" aria-label="Weight in kilograms">
      <span class="unit">kg</span>
    </label>
    <div class="row">
      <input type="date" id="date" name="date" aria-label="Date">
      <button class="btn-primary" id="save" type="submit">Save weigh-in</button>
    </div>
    <p class="msg" id="msg" aria-live="polite"></p>
  </form>

  <section class="stats" aria-label="Summary">
    <div class="stat"><span class="label">Latest</span><span class="v" id="s-latest">–</span></div>
    <div class="stat"><span class="label">7-day avg</span><span class="v" id="s-avg">–</span></div>
    <div class="stat"><span class="label">30-day change</span><span class="v" id="s-change">–</span></div>
  </section>

  <section class="panel" aria-label="Trend">
    <div class="panel-head">
      <span class="label">Trend</span>
      <div class="seg" id="range" role="group" aria-label="Chart range">
        <button type="button" id="r30" data-days="30" aria-pressed="false">30d</button>
        <button type="button" id="r90" data-days="90" aria-pressed="true">90d</button>
        <button type="button" id="r365" data-days="365" aria-pressed="false">1y</button>
        <button type="button" id="rall" data-days="0" aria-pressed="false">All</button>
      </div>
    </div>
    <svg id="chart" role="img" aria-label="Weight over time"></svg>
    <div class="legend"><span class="l-dot">Daily weigh-in</span><span class="l-avg">7-day average</span><span class="example-tag" id="exTag" hidden>Example curve · yours appears after your first weigh-in</span></div>
  </section>

  <section class="panel" aria-label="Log">
    <div class="panel-head">
      <span class="label">History</span>
      <div class="row">
        <label class="btn-ghost" for="importFile" style="cursor:pointer">Import CSV</label>
        <input type="file" id="importFile" accept=".csv,text/csv,text/plain" hidden>
        <button type="button" class="btn-ghost" id="csv">Copy as CSV</button>
      </div>
    </div>
    <textarea id="csvbox" hidden readonly aria-label="CSV data"></textarea>
    <ul class="log" id="log"></ul>
    <p class="empty" id="empty">No weigh-ins yet. Type your weight above and tap Save.</p>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const toDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const DAY = 86400000;
  const fmt = (n) => n.toFixed(1);
  const fmtDelta = (n) => (n > 0 ? "+" : n < 0 ? "−" : "±") + Math.abs(n).toFixed(1);
  const niceDate = (s) => toDate(s).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });

  let entries = new Map();   // "YYYY-MM-DD" -> kg
  let readOnly = false;
  let rangeDays = 90;
  try { const r = localStorage.getItem("wl-range"); if (r !== null) rangeDays = Number(r); } catch (e) {}

  $("date").value = iso(new Date());
  $("date").max = iso(new Date());

  // ---------- storage ----------
  // Sync-ready record store: { "YYYY-MM-DD": { kg, updatedAt, deleted? } }
  // Deletions are kept as tombstones so a future sync can propagate them.
  const STORE_KEY = "weighin.records.v1";
  let records = {};
  function rebuild() {
    entries = new Map();
    for (const [d, r] of Object.entries(records)) if (r && !r.deleted && typeof r.kg === "number") entries.set(d, r.kg);
  }
  function loadLocal() {
    try {
      records = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
      const legacy = localStorage.getItem("wl-entries");
      if (legacy) {
        for (const [d, kg] of Object.entries(JSON.parse(legacy))) if (!records[d] && typeof kg === "number") records[d] = { kg, updatedAt: Date.now() };
        localStorage.setItem(STORE_KEY, JSON.stringify(records));
        localStorage.removeItem("wl-entries");
      }
      setStatus("Stored on this device");
    } catch (e) { setStatus("Not saved — storage unavailable"); }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    rebuild(); render();
  }
  function saveLocal() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(records)); return true; }
    catch (e) { return false; }
  }
  function putRecord(date, kg) { records[date] = { kg, updatedAt: Date.now() }; rebuild(); }
  function dropRecord(date) { records[date] = { deleted: true, updatedAt: Date.now() }; rebuild(); }
  function setStatus(t) { $("status").textContent = t; }

  function init() { loadLocal(); }

  async function saveEntry(date, kg) {
    putRecord(date, kg);
    if (!saveLocal()) throw { code: "local" };
    render();
  }
  async function removeEntry(date) { dropRecord(date); saveLocal(); render(); }

  // ---------- CSV import ----------
  $("importFile").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const text = await f.text();
    let n = 0;
    text.split(/\r?\n/).forEach((line) => {
      const m = line.trim().match(/^(\d{4}-\d{2}-\d{2})[,;\t]\s*"?(\d+(?:[.,]\d+)?)"?/);
      if (m) { const kg = parseFloat(m[2].replace(",", ".")); if (kg >= 20 && kg <= 400) { putRecord(m[1], Math.round(kg * 10) / 10); n++; } }
    });
    const msg = $("msg"); msg.classList.remove("err");
    if (n && saveLocal()) msg.textContent = `Imported ${n} weigh-in${n === 1 ? "" : "s"}.`;
    else { msg.textContent = "No rows found. Use lines like 2026-10-26,78.4"; msg.classList.add("err"); }
    e.target.value = ""; render();
  });

  // ---------- form ----------
  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = $("msg");
    msg.classList.remove("err");
    const kg = parseFloat($("kg").value.replace(",", ".").trim());
    const date = $("date").value;
    if (!date) { msg.textContent = "Pick a date first."; msg.classList.add("err"); return; }
    if (!isFinite(kg) || kg < 20 || kg > 400) { msg.textContent = "Enter a weight between 20 and 400 kg, like 78.4."; msg.classList.add("err"); return; }
    if (readOnly) { msg.textContent = "You can view this log but not add to it."; msg.classList.add("err"); return; }
    const rounded = Math.round(kg * 10) / 10;
    const replaced = entries.has(date);
    $("save").disabled = true;
    try {
      await saveEntry(date, rounded);
      msg.textContent = `${replaced ? "Updated" : "Saved"} ${fmt(rounded)} kg for ${niceDate(date)}.`;
      $("kg").value = "";
    } catch (err) {
      msg.classList.add("err");
      if (err && err.code === "invalid_argument") { readOnly = true; msg.textContent = "This account can view the log but not save to it."; }
      else if (err && err.code === "local") msg.textContent = "Couldn't save: this browser blocks storage (private window?).";
      else msg.textContent = "Couldn't save right now. Check your connection and try again.";
    } finally { $("save").disabled = false; }
  });

  // ---------- range ----------
  $("range").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-days]"); if (!b) return;
    rangeDays = Number(b.dataset.days);
    try { localStorage.setItem("wl-range", String(rangeDays)); } catch (er) {}
    render();
  });

  // ---------- CSV ----------
  $("csv").addEventListener("click", () => {
    const rows = [...entries.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    const csv = "date,kg\n" + rows.map(([d, k]) => `${d},${fmt(k)}`).join("\n");
    const box = $("csvbox");
    const fallback = () => { box.value = csv; box.hidden = false; box.focus(); box.select(); $("csv").textContent = "Select & copy below"; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(csv).then(() => { $("csv").textContent = "Copied"; setTimeout(() => ($("csv").textContent = "Copy as CSV"), 1800); }, fallback);
    } else fallback();
  });

  // ---------- helpers ----------
  function sorted() { return [...entries.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([d, kg]) => ({ d, t: toDate(d).getTime(), kg })); }
  function rolling(list) {
    // average of all weigh-ins in the 7 days ending on each entry
    return list.map((p, i) => {
      let s = 0, n = 0;
      for (let j = i; j >= 0 && p.t - list[j].t < 7 * DAY; j--) { s += list[j].kg; n++; }
      return { t: p.t, kg: s / n };
    });
  }
  function exampleData() {
    const out = [], today = new Date(); today.setHours(0, 0, 0, 0);
    for (let i = 60; i >= 0; i -= 1) {
      if (i % 3 === 1) continue;
      const t = today.getTime() - i * DAY;
      out.push({ t, kg: 82 - (60 - i) * 0.045 + Math.sin(i * 1.7) * 0.5 + Math.cos(i * 0.6) * 0.3 });
    }
    return out;
  }

  // ---------- render ----------
  function render() {
    const list = sorted();
    document.querySelectorAll("#range button").forEach((b) => b.setAttribute("aria-pressed", String(Number(b.dataset.days) === rangeDays)));

    // stats
    const latest = list[list.length - 1];
    const sLatest = $("s-latest"), sAvg = $("s-avg"), sChange = $("s-change");
    sChange.className = "v";
    if (!latest) { sLatest.textContent = "–"; sAvg.textContent = "–"; sChange.textContent = "–"; }
    else {
      sLatest.innerHTML = `${fmt(latest.kg)} <small>kg</small>`;
      const now = toDate(iso(new Date())).getTime();
      const wk = list.filter((p) => now - p.t < 7 * DAY);
      sAvg.innerHTML = wk.length ? `${fmt(wk.reduce((s, p) => s + p.kg, 0) / wk.length)} <small>kg</small>` : "–";
      const target = latest.t - 30 * DAY;
      const older = list.filter((p) => p.t <= latest.t - 21 * DAY);
      if (older.length) {
        const ref = older.reduce((best, p) => (Math.abs(p.t - target) < Math.abs(best.t - target) ? p : best));
        const dlt = latest.kg - ref.kg;
        sChange.innerHTML = `${fmtDelta(dlt)} <small>kg</small>`;
        sChange.classList.add(dlt < 0 ? "down" : dlt > 0 ? "up" : "x");
      } else sChange.innerHTML = `– <small>need 3 wks</small>`;
    }

    drawChart(list);

    // log
    const log = $("log"); log.textContent = "";
    $("empty").hidden = list.length > 0;
    const rev = [...list].reverse();
    rev.forEach((p, i) => {
      const prev = rev[i + 1];
      const li = document.createElement("li");
      const d = document.createElement("span"); d.className = "d"; d.textContent = niceDate(p.d);
      const w = document.createElement("span"); w.className = "w"; w.textContent = fmt(p.kg) + " kg";
      const dl = document.createElement("span"); dl.className = "delta";
      if (prev) { const x = p.kg - prev.kg; dl.textContent = fmtDelta(x); dl.classList.add(x < 0 ? "down" : x > 0 ? "up" : "x"); }
      const del = document.createElement("button"); del.type = "button"; del.className = "del"; del.textContent = "Delete";
      del.setAttribute("aria-label", "Delete weigh-in for " + niceDate(p.d));
      let timer = null;
      del.addEventListener("click", async () => {
        if (!del.classList.contains("armed")) {
          del.classList.add("armed"); del.textContent = "Confirm";
          timer = setTimeout(() => { del.classList.remove("armed"); del.textContent = "Delete"; }, 3000);
          return;
        }
        clearTimeout(timer); del.disabled = true;
        try { await removeEntry(p.d); } catch (e) { del.disabled = false; $("msg").textContent = "Couldn't delete right now. Try again."; $("msg").classList.add("err"); }
      });
      li.append(d, w, dl, del);
      log.append(li);
    });
  }

  function drawChart(list) {
    const svg = $("chart");
    const W = Math.max(280, svg.clientWidth || 520), H = 200;
    const m = { l: 38, r: 10, t: 10, b: 22 };
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("height", H);
    const isExample = list.length === 0;
    $("exTag").hidden = !isExample;
    let pts = isExample ? exampleData() : list.map((p) => ({ t: p.t, kg: p.kg }));
    if (!isExample && rangeDays > 0) {
      const cut = toDate(iso(new Date())).getTime() - rangeDays * DAY;
      const all = pts; pts = pts.filter((p) => p.t >= cut);
      if (!pts.length) pts = all.slice(-1);
    }
    const avg = isExample ? rolling(pts) : rolling(list.map((p) => ({ t: p.t, kg: p.kg }))).filter((a) => a.t >= pts[0].t);

    let t0 = pts[0].t, t1 = pts[pts.length - 1].t;
    if (t1 - t0 < 6 * DAY) { t0 = t1 - 6 * DAY; }
    const vals = pts.map((p) => p.kg).concat(avg.map((a) => a.kg));
    let lo = Math.min(...vals), hi = Math.max(...vals);
    if (hi - lo < 2) { const mid = (hi + lo) / 2; lo = mid - 1; hi = mid + 1; }
    const span = hi - lo;
    const step = span <= 3 ? 0.5 : span <= 8 ? 1 : span <= 20 ? 2 : span <= 50 ? 5 : 10;
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;

    const x = (t) => m.l + ((t - t0) / Math.max(1, t1 - t0)) * (W - m.l - m.r);
    const y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
    const NS = "http://www.w3.org/2000/svg";
    const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
    svg.textContent = "";
    const op = isExample ? 0.45 : 1;

    // grid + y labels
    const nTicks = Math.round((hi - lo) / step);
    const every = nTicks > 6 ? Math.ceil(nTicks / 5) : 1;
    for (let i = 0; i <= nTicks; i += every) {
      const v = lo + i * step;
      svg.append(el("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: "var(--line)", "stroke-width": 1 }));
      const tx = el("text", { x: m.l - 6, y: y(v) + 3, "text-anchor": "end" });
      tx.textContent = step < 1 ? v.toFixed(1) : String(v); svg.append(tx);
    }
    // x labels: first, middle, last
    const xl = [t0, (t0 + t1) / 2, t1];
    xl.forEach((t, i) => {
      const tx = el("text", { x: x(t), y: H - 6, "text-anchor": i === 0 ? "start" : i === 2 ? "end" : "middle" });
      tx.textContent = new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short" }); svg.append(tx);
    });
    // dots
    const g = el("g", { opacity: op });
    pts.forEach((p) => g.append(el("circle", { cx: x(p.t), cy: y(p.kg), r: pts.length > 120 ? 1.8 : 2.8, fill: "var(--muted)", "fill-opacity": 0.55 })));
    // average line + area
    if (avg.length > 1) {
      const d = avg.map((a, i) => `${i ? "L" : "M"}${x(a.t).toFixed(1)},${y(a.kg).toFixed(1)}`).join("");
      const area = d + `L${x(avg[avg.length - 1].t).toFixed(1)},${H - m.b}L${x(avg[0].t).toFixed(1)},${H - m.b}Z`;
      g.append(el("path", { d: area, fill: "var(--accent)", "fill-opacity": 0.08, stroke: "none" }));
      g.append(el("path", { d, fill: "none", stroke: "var(--accent)", "stroke-width": 2.5, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }
    const last = avg[avg.length - 1] || pts[pts.length - 1];
    g.append(el("circle", { cx: x(last.t), cy: y(last.kg), r: 4.5, fill: "var(--accent)", stroke: "var(--surface)", "stroke-width": 2 }));
    svg.append(g);
  }

  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 120); });
  init();
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body></html>
